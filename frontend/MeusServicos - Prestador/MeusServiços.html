<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meus Serviços – Servixus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../Busca-Servicos/styles.css">
    <script>if(!localStorage.getItem("id_usuario")||localStorage.getItem("tipo_usuario")!=="prestador")location.replace("../login-form/login.html");</script>
  </head>
  <body data-tipo-required="prestador">
    <header>
      <div class="header-esquerda">
        <div class="logonome">
          <img class="logo" src="../imagens/85b278c4-b9b3-4686-8e9d-728843eb81f9.png" alt="Servixus Logo">
          <h1 class="nome">Servixus</h1>
        </div>
        <nav class="menu-navegacao">
          <a href="../Agenda - Prestador/agenda.html" class="info">Minha Agenda</a>
          <a href="#" class="info">Meus Serviços</a>
          <a href="../Perfil-Prestador/perfil.html" class="info">Perfil</a>
        </nav>
      </div>
      <div class="header-botoes">
        <button class="btn btn-outline-light btn-sm" id="btnSair">Sair</button>
      </div>
    </header>

    <main class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Meus Serviços</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAdicionarServico">+ Adicionar Serviço</button>
      </div>

      <div id="containerAlerta"></div>
      <div id="listaServicos" class="row g-3"></div>
    </main>

    <!-- Modal: Adicionar Serviço -->
    <div class="modal fade" id="modalAdicionarServico" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Adicionar Serviço</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="containerAlertaModal"></div>
            <div class="form-floating mb-3">
              <select class="form-select" id="servicoSelect">
                <option value="" disabled selected>Selecione um serviço</option>
              </select>
              <label>Serviço</label>
            </div>
            <div class="form-floating mb-3">
              <select class="form-select" id="servicoTipoCobranca">
                <option value="hora">Por hora</option>
                <option value="diaria">Por diária</option>
                <option value="servico">Por serviço</option>
              </select>
              <label>Tipo de cobrança</label>
            </div>
            <div class="form-floating">
              <input type="number" class="form-control" id="servicoPreco" placeholder="Preço" min="0" step="0.01">
              <label>Preço base (R$)</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" id="btnSalvarServico">Salvar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal: Editar Serviço -->
    <div class="modal fade" id="modalEditarServico" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Editar Serviço</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="containerAlertaEditar"></div>
            <input type="hidden" id="editarIdServico">
            <div class="form-floating mb-3">
              <select class="form-select" id="editarTipoCobranca">
                <option value="hora">Por hora</option>
                <option value="diaria">Por diária</option>
                <option value="servico">Por serviço</option>
              </select>
              <label>Tipo de cobrança</label>
            </div>
            <div class="form-floating">
              <input type="number" class="form-control" id="editarPreco" placeholder="Preço" min="0" step="0.01">
              <label>Preço base (R$)</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" id="btnSalvarEdicao">Salvar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../sessao.js"></script>
    <script src="servicos.js"></script>
  </body>
</html>
