<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../Busca-Servicos/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/@coreui/coreui@5.0.0/dist/css/coreui.min.css" rel="stylesheet"
        integrity="sha384-..." crossorigin="anonymous">
</head>

<body>
    <header>
        <div class="header-esquerda">
            <div class="logonome">
                <img class="logo" src="../imagens/85b278c4-b9b3-4686-8e9d-728843eb81f9.png" alt="Servixus Logo">
                <h1 class="nome">Servixus</h1>
            </div>

            <nav class="menu-navegacao">
                <a href="#home" class="info">Meus Serviços</a>
                <a href="#sobre" class="info">Perfil</a>
                <a href="#" class=info>Agenda</a>
            </nav>
        </div>
        <div class="header-botoes">
            <button>Sair</button>
        </div>
    </header>
    <main class="container my-5 d-flex justify-content-center">

        <div class="card p-4 shadow bg-body-tertiary w-100" style="max-width: 1300px; min-height: 500px;">
            <h1 class="mb-4">Minha Agenda de Serviços</h1>

            <!--<div class="row mb-5">
            <div class="col-12 d-flex justify-content-center">
                <div class="border rounded bg-dark p-2 text-white" 
                     id="calendarioPrestador"
                     data-coreui-locale="pt-BR" 
                     data-coreui-toggle="calendar">
                </div>
            </div>
        </div>-->
            <div class="row mb-5 justify-content-center">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="form-floating">
                        <select class="form-select border-secondary bg-light" id="selectDataServico">
                            <option selected disabled value="">Carregando datas...</option>
                        </select>
                        <label for="selectDataServico" class="text-body-secondary">Selecione o Dia do Serviço</label>
                    </div>
                </div>
            </div>

            <h3 class="h5 mb-3 text-body-secondary">Serviços do Dia Selecionado</h3>
            <hr class="mb-4">

            <div class="row g-3" id="listaAgendamentos">

                <div class="col-12">
                    <div class="card shadow-sm bg-dark-subtle">
                        <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3">
                            <div style="min-width: 200px;">
                                <h5 class="card-title mb-1 fs-6">Carlos Silva</h5>
                                <span class="badge bg-primary">Instalação Elétrica</span>
                            </div>

                            <div class="d-flex gap-4 text-center">
                                <div>
                                    <small class="text-body-secondary d-block">Início</small>
                                    <strong class="text-success">26/06/2026 - 09:00</strong>
                                </div>
                                <div class="border-start ps-4">
                                    <small class="text-body-secondary d-block">Término</small>
                                    <strong class="text-danger">26/06/2026 - 12:00</strong>
                                </div>
                            </div>

                            <div class="d-flex align-items-center gap-3">
                                <span class="badge bg-success-subtle text-success-emphasis">Confirmado</span>
                                <button class="btn btn-sm btn-light">Iniciar Serviço</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <div class="card shadow-sm bg-dark-subtle">
                        <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3">
                            <div style="min-width: 200px;">
                                <h5 class="card-title mb-1 fs-6">Marcos Souza</h5>
                                <span class="badge bg-warning text-dark">Manutenção Geral</span>
                            </div>

                            <div class="d-flex gap-4 text-center">
                                <div>
                                    <small class="text-body-secondary d-block">Início</small>
                                    <strong class="text-success">26/06/2026 - 14:00</strong>
                                </div>
                                <div class="border-start ps-4">
                                    <small class="text-body-secondary d-block">Término</small>
                                    <strong class="text-danger">26/06/2026 - 17:30</strong>
                                </div>
                            </div>

                            <div class="d-flex align-items-center gap-3">
                                <span class="badge bg-warning-subtle text-warning-emphasis">Em Andamento</span>
                                <button class="btn btn-sm btn-success">Concluir</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@coreui/coreui@5.0.0/dist/js/coreui.bundle.min.js" integrity="sha384-..."
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
