<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minha Agenda – Servixus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../Busca-Servicos/styles.css">
    <script>if(!localStorage.getItem("id_usuario")||localStorage.getItem("tipo_usuario")!=="prestador")location.replace("../login-form/login.html");</script>
  </head>
  <body data-tipo-required="prestador">
    <header>
      <div class="header-esquerda">
        <div class="logonome">
          <img class="logo" src="../imagens/85b278c4-b9b3-4686-8e9d-728843eb81f9.png" alt="Servixus Logo">
          <h1 class="nome">Servixus</h1>
        </div>
        <nav class="menu-navegacao">
          <a href="#" class="info">Minha Agenda</a>
          <a href="../MeusServicos - Prestador/MeusServiços.html" class="info">Meus Serviços</a>
          <a href="../Perfil-Prestador/perfil.html" class="info">Perfil</a>
        </nav>
      </div>
      <div class="header-botoes">
        <button class="btn btn-outline-light btn-sm" id="btnSair">Sair</button>
      </div>
    </header>

    <main class="container my-5">

      <!-- Agendamentos -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Minha Agenda</h2>
        <div class="form-floating" style="width:220px">
          <select class="form-select form-select-sm" id="filtroStatus">
            <option value="" selected>Todos</option>
            <option value="aguardando_orcamento">Aguardando Orçamento</option>
            <option value="orcamento_enviado">Orçamento Enviado</option>
            <option value="confirmado">Confirmado</option>
            <option value="em_andamento">Em Andamento</option>
            <option value="concluido">Concluído</option>
            <option value="cancelado">Cancelado</option>
          </select>
          <label>Filtrar por status</label>
        </div>
      </div>

      <div id="containerAlerta"></div>
      <div id="listaAgendamentos" class="row g-3 mb-5"></div>

      <!-- Disponibilidade -->
      <hr>
      <h4 class="mt-4 mb-3">Minha Disponibilidade Semanal</h4>
      <div id="containerAlertaDisp"></div>
      <div class="card p-4 shadow">
        <div id="tabelaDisponibilidade"></div>
        <button class="btn btn-primary mt-3" id="btnSalvarDisp">Salvar Disponibilidade</button>
      </div>
    </main>

    <!-- Modal: Enviar Orçamento -->
    <div class="modal fade" id="modalOrcamento" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Enviar Orçamento</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="containerAlertaModal"></div>
            <input type="hidden" id="orcamentoIdAgendamento">
            <div class="form-floating mb-3">
              <input type="number" class="form-control" id="orcamentoValor" placeholder="Valor" min="0" step="0.01">
              <label>Valor (R$)</label>
            </div>
            <div class="form-floating">
              <select class="form-select" id="orcamentoTipo">
                <option value="hora">Por hora</option>
                <option value="diaria">Por diária</option>
                <option value="servico">Por serviço</option>
              </select>
              <label>Tipo de cobrança</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" id="btnEnviarOrcamento">Enviar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../sessao.js"></script>
    <script src="agenda.js"></script>
  </body>
</html>
