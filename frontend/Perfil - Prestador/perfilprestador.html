<!doctype html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil do Prestador - Servixus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Busca-Servicos/styles.css">
</head>

<body>
    <header>
        <div class="header-esquerda">
            <div class="logonome">
                <img class="logo" src="../imagens/85b278c4-b9b3-4686-8e9d-728843eb81f9.png" alt="Servixus Logo">
                <h1 class="nome">Servixus</h1>
            </div>

            <!-- O menu está vazio, o JS vai preencher -->
            <nav class="menu-navegacao" id="menuDinamico"></nav>

        </div>
        <div class="header-botoes">
            <button id="btnSair" class="btn btn-outline-danger">Sair</button>
        </div>
    </header>

    <main class="container my-5 d-flex justify-content-center">
        <div class="w-100" style="max-width: 1000px;">

            <div id="alertaPerfil"></div>

            <div class="card p-4 shadow-sm bg-body-tertiary mb-4">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                    <div class="d-flex gap-4 align-items-center">
                        <div class="bg-secondary rounded-circle d-flex justify-content-center align-items-center"
                            style="width: 100px; height: 100px; font-size: 2rem;">
                            <i class="bi bi-person-fill text-white"></i>
                        </div>
                        <div>
                            <h2 class="mb-1" id="perfilNome">Carregando...</h2>
                            <span class="badge bg-primary mb-2" id="perfilCategoria">...</span>
                            <p class="text-body-secondary mb-0">
                                <i class="bi bi-geo-alt-fill"></i> <span id="perfilLocalizacao">Cidade, Estado</span>
                            </p>
                        </div>
                    </div>

                    <button class="btn btn-outline-light d-none" id="btnEditarPerfil" data-bs-toggle="modal"
                        data-bs-target="#modalEditarPerfil">
                        <i class="bi bi-pencil-square"></i> Editar Perfil
                    </button>
                </div>

                <hr class="my-4">

                <h5 class="mb-3">Sobre o Profissional</h5>
                <p id="perfilDescricao" class="text-body-secondary">
                    Nenhuma descrição fornecida.
                </p>
            </div>

            <div class="row g-4">
                <div class="col-12 col-md-6">
                    <div class="card shadow-sm bg-body-tertiary h-100 p-4">
                        <h5 class="mb-4">Serviços Oferecidos</h5>
                        <div id="listaServicos" class="d-flex flex-column gap-3">
                            <p class="text-secondary small">Carregando serviços...</p>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-6">
                    <div class="card shadow-sm bg-body-tertiary h-100 p-4">
                        <h5 class="mb-4">Avaliações</h5>
                        <div id="listaAvaliacoes" class="d-flex flex-column gap-3">
                            <p class="text-secondary small">Carregando avaliações...</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div class="modal fade" id="modalEditarPerfil" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Editar Meu Perfil</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditarPerfil">
                        <div class="mb-3">
                            <label class="form-label">Categoria de Atuação</label>
                            <select class="form-select bg-dark text-white" id="editCategoria" name="id_categoria">
                                <option value="1">Pedreiro</option>
                                <option value="2">Eletricista</option>
                                <option value="3">Pintor</option>
                                <option value="4">Marceneiro</option>
                                <option value="5">Limpeza</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descrição Profissional</label>
                            <textarea class="form-control bg-dark text-white" id="editDescricao"
                                name="descricao_profissional" rows="4"></textarea>
                        </div>

                        <h6 class="mt-4 mb-3 text-primary">Localização</h6>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">CEP</label>
                                <input type="text" class="form-control bg-dark text-white" id="editCep" name="cep">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">Logradouro</label>
                                <input type="text" class="form-control bg-dark text-white" id="editLogradouro"
                                    name="logradouro">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Bairro</label>
                                <input type="text" class="form-control bg-dark text-white" id="editBairro"
                                    name="bairro">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Cidade</label>
                                <input type="text" class="form-control bg-dark text-white" id="editCidade"
                                    name="cidade">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Estado</label>
                                <input type="text" class="form-control bg-dark text-white" id="editEstado"
                                    name="estado">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnSalvarPerfil">Salvar Alterações</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="../sessao.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            // CONTEXTO: Defina isso via PHP na renderização ou via JWT do frontend
            const ID_USUARIO_VISUALIZADO = 1; // O ID do prestador na URL (ex: ?id=1)
            const SOU_O_DONO = true; // Se o usuário logado for o mesmo do perfil, mude para true

            // === 1. LÓGICA DE VISUALIZAÇÃO (Cliente -> Prestador) ===
            function carregarPerfil() {
                // Aqui você faria o fetch real para sua API backend/api/prestadores/get.php?id_usuario=...
                // Simulando o retorno JSON do seu PHP:
                const mockRespostaPHP = {
                    id_usuario: 1,
                    nome: "João Silva",
                    descricao_profissional: "Especialista em instalações residenciais e manutenção de curto-circuito com 10 anos de experiência.",
                    cidade: "Campinas",
                    estado: "SP",
                    categoria: "Eletricista",
                    servicos: [
                        { id_servico: 1, titulo: "Troca de Fiação", descricao: "Substituição completa.", tipo_cobranca: "Empreitada", preco_base: "1500.00" },
                        { id_servico: 2, titulo: "Visita Técnica", descricao: "Análise de problemas elétricos.", tipo_cobranca: "Hora", preco_base: "80.00" }
                    ],
                    avaliacoes: [
                        { cliente_nota: 5, cliente_comentario: "Excelente profissional, resolveu o problema rápido!", nome_cliente: "Maria Souza" }
                    ]
                };

                // Preencher Cabeçalho
                document.getElementById('perfilNome').textContent = mockRespostaPHP.nome;
                document.getElementById('perfilCategoria').textContent = mockRespostaPHP.categoria;
                document.getElementById('perfilLocalizacao').textContent = `${mockRespostaPHP.cidade}, ${mockRespostaPHP.estado}`;
                document.getElementById('perfilDescricao').textContent = mockRespostaPHP.descricao_profissional;

                // Preencher Modal de Edição com os dados atuais (caso ele abra)
                document.getElementById('editDescricao').value = mockRespostaPHP.descricao_profissional;
                document.getElementById('editCidade').value = mockRespostaPHP.cidade;
                document.getElementById('editEstado').value = mockRespostaPHP.estado;

                // Renderizar Serviços
                const containerServicos = document.getElementById('listaServicos');
                containerServicos.innerHTML = '';
                mockRespostaPHP.servicos.forEach(s => {
                    containerServicos.innerHTML += `
                        <div class="border border-secondary rounded p-3">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h6 class="mb-0 text-white">${s.titulo}</h6>
                                <span class="badge bg-success">R$ ${s.preco_base} / ${s.tipo_cobranca}</span>
                            </div>
                            <p class="text-body-secondary small mb-0">${s.descricao}</p>
                        </div>
                    `;
                });

                // Renderizar Avaliações
                const containerAvaliacoes = document.getElementById('listaAvaliacoes');
                containerAvaliacoes.innerHTML = '';
                if (mockRespostaPHP.avaliacoes.length === 0) {
                    containerAvaliacoes.innerHTML = '<p class="text-secondary small">Nenhuma avaliação ainda.</p>';
                } else {
                    mockRespostaPHP.avaliacoes.forEach(a => {
                        // Gera as estrelas baseado na nota
                        let estrelas = '';
                        for (let i = 0; i < 5; i++) {
                            estrelas += i < a.cliente_nota ? '<i class="bi bi-star-fill text-warning"></i> ' : '<i class="bi bi-star text-secondary"></i> ';
                        }

                        containerAvaliacoes.innerHTML += `
                            <div class="border-bottom border-secondary pb-3">
                                <div class="d-flex justify-content-between mb-1">
                                    <strong class="text-white small">${a.nome_cliente}</strong>
                                    <span class="small">${estrelas}</span>
                                </div>
                                <p class="text-body-secondary small mb-0">"${a.cliente_comentario}"</p>
                            </div>
                        `;
                    });
                }

                // Controle de Permissão: Se for o dono, mostra o botão de editar
                if (SOU_O_DONO) {
                    document.getElementById('btnEditarPerfil').classList.remove('d-none');
                }
            }

            carregarPerfil();

            // === 2. LÓGICA DE EDIÇÃO (Visão Própria do Prestador) ===
            const btnSalvar = document.getElementById('btnSalvarPerfil');
            btnSalvar.addEventListener('click', function () {

                const form = document.getElementById('formEditarPerfil');
                const formData = new FormData(form);
                formData.append('id_usuario', ID_USUARIO_VISUALIZADO); // Envia o ID para o POST

                // Feedback visual de carregamento
                btnSalvar.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Salvando...';
                btnSalvar.disabled = true;

                // Simulação da chamada para sua API backend/api/me/prestador.php
                /* fetch('../backend/api/me/prestador.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => { ... }) */

                setTimeout(() => {
                    // Simulando sucesso do PHP
                    const modalEl = document.getElementById('modalEditarPerfil');
                    const modalInstance = bootstrap.Modal.getInstance(modalEl);
                    modalInstance.hide(); // Fecha o modal

                    // Mostra alerta de sucesso
                    document.getElementById('alertaPerfil').innerHTML = `
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="bi bi-check-circle-fill flex-shrink-0 me-2"></i>
                            <strong>Sucesso!</strong> Perfil atualizado com sucesso.
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    `;

                    btnSalvar.innerHTML = 'Salvar Alterações';
                    btnSalvar.disabled = false;

                    // Recarrega os dados visuais
                    carregarPerfil();
                }, 1000);
            });
        });
    </script>
</body>

</html>
