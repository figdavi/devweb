<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil do Prestador – Servixus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../Busca-Servicos/styles.css">
    <script>if(!localStorage.getItem("id_usuario"))location.replace("../login-form/login.html");</script>
  </head>
  <body>
    <header>
      <div class="header-esquerda">
        <div class="logonome">
          <img class="logo" src="../imagens/85b278c4-b9b3-4686-8e9d-728843eb81f9.png" alt="Servixus Logo">
          <h1 class="nome">Servixus</h1>
        </div>
        <nav class="menu-navegacao" id="navMenu"></nav>
      </div>
      <div class="header-botoes">
        <button class="btn btn-outline-light btn-sm" id="btnSair">Sair</button>
      </div>
    </header>

    <main class="container my-5">
      <div id="containerAlerta"></div>

      <!-- Perfil -->
      <div class="card p-4 shadow-sm mb-4">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
          <div>
            <h2 class="mb-1" id="perfilNome">Carregando...</h2>
            <span class="badge bg-primary mb-2" id="perfilCategoria"></span>
            <p class="text-secondary mb-0" id="perfilLocalizacao"></p>
          </div>
          <button class="btn btn-success d-none" id="btnAgendar" data-bs-toggle="modal" data-bs-target="#modalAgendar">
            Agendar serviço
          </button>
        </div>
        <hr>
        <h6 class="mb-2">Sobre o profissional</h6>
        <p class="text-secondary mb-0" id="perfilDescricao">Nenhuma descrição fornecida.</p>
      </div>

      <div class="row g-4">
        <!-- Serviços -->
        <div class="col-12 col-md-6">
          <div class="card p-4 shadow-sm h-100">
            <h5 class="mb-3">Serviços oferecidos</h5>
            <div id="listaServicos"><p class="text-secondary small">Carregando...</p></div>
          </div>
        </div>
        <!-- Avaliações -->
        <div class="col-12 col-md-6">
          <div class="card p-4 shadow-sm h-100">
            <h5 class="mb-3">Avaliações</h5>
            <div id="listaAvaliacoes"><p class="text-secondary small">Carregando...</p></div>
          </div>
        </div>
      </div>
    </main>

    <!-- Modal: Agendar serviço -->
    <div class="modal fade" id="modalAgendar" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Agendar serviço</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="containerAlertaModal"></div>
            <div class="form-floating mb-3">
              <select class="form-select" id="agendarServico">
                <option value="" disabled selected>Selecione um serviço</option>
              </select>
              <label>Serviço</label>
            </div>
            <div class="form-floating mb-3">
              <select class="form-select" id="agendarLocal">
                <option value="" disabled selected>Selecione seu local</option>
              </select>
              <label>Local de atendimento</label>
            </div>
            <div class="form-floating mb-3">
              <textarea class="form-control" id="agendarDescricao" placeholder="Descrição" style="height:80px"></textarea>
              <label>Descrição (opcional)</label>
            </div>
            <div class="form-floating">
              <input type="datetime-local" class="form-control" id="agendarDataInicio">
              <label>Data e hora preferida</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-success" id="btnConfirmarAgendamento">Solicitar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../sessao.js"></script>
    <script src="perfilprestador.js"></script>
  </body>
</html>
