<!doctype html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="loginstyles.css">
</head>

<body class="d-flex align-items-center Bg-body-tertiary">
    <main class="w-100 m-auto form-container-registrar">
        <form id="formRegistrarCliente">
            <div id="containerAlerta"></div>
            <a href="../index.html" class="d-flex align-items-center text-decoration-none">
                <img src="../imagens/85b278c4-b9b3-4686-8e9d-728843eb81f9.png" class="me-3" height="70" />
                <h1 class="nome m-0">Servixus</h1>
            </a>
            <h1 class="h3 mb-3 fw-normal">Registrar Cliente</h1>
            <div class="form-floating">
                <input type="text" class="form-control mb-3 reg-nome" id="floating-input" placeholder="Seu nome">
                <label for="floating-input">Nome</label>
            </div>
            <div class="form-floating">
                <input type="email" class="form-control mb-3 reg-email" id="floating-input"
                    placeholder="Seu-email@gmail.com">
                <label for="floating-input">E-mail</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control mb-3 reg-senha" id="floating-input" placeholder="Senha">
                <label for="floating-input">Senha</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control mb-3 reg-confirmar-senha" id="floating-input"
                    placeholder="Senha">
                <label for="floating-input">Confirmar Senha</label>
            </div>
            <div class="form-floating">
                <input type="text" class="form-control mb-3 reg-nome-local" id="regNomeLocal" placeholder="Nome do local">
                <label for="regNomeLocal">Nome do local (ex: Casa, Trabalho)</label>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-8">
                    <div class="form-floating">
                        <input type="text" class="form-control reg-cep" id="regCep" placeholder="CEP"
                            inputmode="numeric" maxlength="8" pattern="\d{8}"
                            oninput="this.value = this.value.replace(/\D/g, '')">
                        <label for="regCep">CEP (apenas números)</label>
                    </div>
                </div>
                <div class="col-4">
                    <div class="form-floating">
                        <input type="text" class="form-control reg-numero" id="regNumero" placeholder="Número">
                        <label for="regNumero">Número</label>
                    </div>
                </div>
            </div>
            <div class="form-floating mb-3" id="regEnderecoContainer" style="display:none">
                <input type="text" class="form-control" id="regLogradouro" readonly placeholder="Logradouro">
                <label for="regLogradouro">Logradouro</label>
            </div>
            <div class="row g-2 mb-3" id="regEnderecoCidadeContainer" style="display:none">
                <div class="col-8">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="regCidade" readonly placeholder="Cidade">
                        <label for="regCidade">Cidade</label>
                    </div>
                </div>
                <div class="col-4">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="regEstado" readonly placeholder="UF">
                        <label for="regEstado">UF</label>
                    </div>
                </div>
            </div>
            <div class="form-floating mb-3">
                <input type="text" class="form-control reg-complemento" id="regComplemento" placeholder="Complemento">
                <label for="regComplemento">Complemento (opcional)</label>
            </div>
            <div class="form-floating">
                <input type="tel" class="form-control mb-3 reg-telefone" id="floating-telefone"
                    placeholder="(00) 00000-0000">
                <label for="floating-telefone">Telefone</label>
            </div>
            <a href="login.html" class="mb-4">Já possui uma conta?</a>
            <button class="btn btn-primary w-100 py-2 my-3">Registrar</button>
            <p class="text-body-secondary mt-5 mb-3">© 2026 Servixus</p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="validacao.js"></script>
    
</body>

</html>
