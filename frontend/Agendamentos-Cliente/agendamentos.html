<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meus Agendamentos – Servixus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../Busca-Servicos/styles.css">
    <script>if(!localStorage.getItem("id_usuario")||localStorage.getItem("tipo_usuario")!=="cliente")location.replace("../login-form/login.html");</script>
  </head>
  <body data-tipo-required="cliente">
    <header>
      <div class="header-esquerda">
        <div class="logonome">
          <img class="logo" src="../imagens/85b278c4-b9b3-4686-8e9d-728843eb81f9.png" alt="Servixus Logo">
          <h1 class="nome">Servixus</h1>
        </div>
        <nav class="menu-navegacao">
          <a href="../Busca-Servicos/servicos.html" class="info">Buscar Serviços</a>
          <a href="#" class="info">Meus Agendamentos</a>
          <a href="../Perfil-Cliente/perfil.html" class="info">Perfil</a>
        </nav>
      </div>
      <div class="header-botoes">
        <button class="btn btn-outline-light btn-sm" id="btnSair">Sair</button>
      </div>
    </header>

    <main class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Meus Agendamentos</h2>
        <div class="form-floating" style="width:220px">
          <select class="form-select form-select-sm" id="filtroStatus">
            <option value="" selected>Todos</option>
            <option value="aguardando_orcamento">Aguardando Orçamento</option>
            <option value="orcamento_realizado">Orçamento Realizado</option>
            <option value="confirmado">Confirmado</option>
            <option value="em_andamento">Em Andamento</option>
            <option value="concluido">Concluído</option>
            <option value="cancelado">Cancelado</option>
          </select>
          <label>Filtrar por status</label>
        </div>
      </div>

      <div id="containerAlerta"></div>
      <div id="listaAgendamentos" class="row g-3"></div>
    </main>

    <!-- Modal: Aceitar/Recusar Orçamento -->
    <div class="modal fade" id="modalOrcamento" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Orçamento Recebido</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="modalOrcamentoBody"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            <button type="button" class="btn btn-danger" id="btnRecusarOrcamento">Recusar</button>
            <button type="button" class="btn btn-success" id="btnAceitarOrcamento">Aceitar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal: Avaliar Serviço -->
    <div class="modal fade" id="modalAvaliar" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Avaliar Serviço</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="containerAlertaAvaliar"></div>
            <input type="hidden" id="avaliarIdAgendamento">
            <div class="mb-3">
              <label class="form-label">Nota (1 a 5)</label>
              <div class="d-flex gap-2">
                <template id="tmplEstrela">
                  <button type="button" class="btn btn-outline-warning estrela" data-nota=""></button>
                </template>
                <button type="button" class="btn btn-outline-warning estrela" data-nota="1">★ 1</button>
                <button type="button" class="btn btn-outline-warning estrela" data-nota="2">★ 2</button>
                <button type="button" class="btn btn-outline-warning estrela" data-nota="3">★ 3</button>
                <button type="button" class="btn btn-outline-warning estrela" data-nota="4">★ 4</button>
                <button type="button" class="btn btn-outline-warning estrela" data-nota="5">★ 5</button>
              </div>
              <input type="hidden" id="avaliarNota" value="">
            </div>
            <div class="form-floating">
              <textarea class="form-control" id="avaliarComentario" placeholder="Comentário" style="height:90px"></textarea>
              <label>Comentário (opcional)</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" id="btnEnviarAvaliacao">Enviar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../sessao.js"></script>
    <script src="agendamentos.js"></script>
  </body>
</html>
